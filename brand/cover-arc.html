<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f5f4ef; }
  /* 3000x1000, reduzido para 1500x500 depois (2x para nitidez) */
  .cover { position: relative; width: 3000px; height: 1000px; background: #f5f4ef; overflow: hidden; font-family: Manrope, system-ui, sans-serif; color: #191917; }
  .text { position: absolute; left: 640px; top: 190px; }
  .kicker { display: flex; align-items: center; gap: 18px; font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6a64; font-weight: 500; }
  .kicker i { width: 18px; height: 18px; border-radius: 50%; background: #d97757; display: inline-block; }
  h1 { margin: 34px 0 0; font-size: 168px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
  p { margin: 44px 0 0; font-size: 58px; line-height: 1.25; color: #3d3c37; font-weight: 500; max-width: 1500px; }
  .mark { position: absolute; right: 230px; top: 150px; width: 560px; height: 560px; opacity: 0.16; }
  .mark img { width: 100%; height: 100%; }
  .url { position: absolute; right: 120px; bottom: 90px; font-size: 44px; font-weight: 600; color: #d97757; }
</style>
</head>
<body>
<div class="cover">
  <div class="text">
    <div class="kicker"><i></i> A connector for Claude · Argus on Arc · autonomous token agents</div>
    <h1>Claudearc</h1>
    <p>Launch a token by talking to Claude.<br>Then give it an agent that runs itself.</p>
  </div>
  <div class="mark"><img src="out/symbol-A-arc-terracotta.png" alt=""></div>
  <div class="url">claudearc.com</div>
</div>
</body>
</html>
